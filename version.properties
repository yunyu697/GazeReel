# GazeReel / 凝影 · 版本号唯一真相源
#
# 格式：<major>.<minor>.<patch>[-alpha<N>]
#
# 规则（2026-11-10 定）：
#   · major 无上限
#   · minor / patch 不得超过 10，也就是不能出现 11
#   · alpha 编号无上限（alpha11 合法）
#   · 有重大更新时版本号进位，重新从 alpha1 开始发
#   · 正式完工之前只发 alpha
#
# 合法：11.10.10-alpha11   非法：1.11.11-alpha1
#
# 不要手改这一行。用 `python3 tools/bump_version.py` 升版本，它会自动进位：
#   bump_version.py alpha    1.0.0-alpha1 → 1.0.0-alpha2
#   bump_version.py patch    1.0.0-alpha3 → 1.0.1-alpha1
#   bump_version.py minor    1.0.10-alpha2 → 1.1.0-alpha1
#   bump_version.py major    1.10.10-alpha9 → 2.0.0-alpha1
#
# 段位越界时构建会直接失败（见 app/build.gradle.kts 的 version 校验），
# 所以「不小心写成 1.11.11」不会悄悄发出去。
version=1.0.0-alpha4
