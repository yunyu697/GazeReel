name: CI

# 每次推到 main、每个 PR、以及手动触发，都要过一遍：结构校验 → 版本号校验 → 编译。
# 这条流水线只负责「能不能构建」，不产出可发布的包（发版走 release.yml）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 校验与编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # Windows 上提交的 gradlew 可能丢掉可执行位，这里兜一层。
      - name: 修正 gradlew 权限
        run: chmod +x gradlew

      - name: 结构校验
        run: python3 tools/check_structure.py

      - name: 版本号校验
        run: python3 tools/bump_version.py --check

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 读取版本号
        id: version
        run: echo "name=$(./gradlew -q :app:printVersion)" >> "$GITHUB_OUTPUT"

      - name: 归档 APK
        uses: actions/upload-artifact@v4
        with:
          name: GazeReel-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
