name: Release Alpha

# 只认 tag：推一个 v1.0.0-alpha1 这样的 tag 才会发版。
# tag 必须和 version.properties 里的版本号完全一致，否则直接失败——
# 防止「tag 写着 alpha3、包里其实是 alpha2」这种没法追溯的事。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 alpha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 修正 gradlew 权限
        run: chmod +x gradlew

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(./gradlew -q :app:printVersion)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

      - name: 校验 tag 与 version.properties 一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          WANT="v${{ steps.version.outputs.name }}"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag 是 $TAG，但 version.properties 是 $WANT。先跑 tools/bump_version.py 再打 tag。"
            exit 1
          fi
          echo "tag 与版本号一致：$TAG"

      - name: 结构校验
        run: python3 tools/check_structure.py

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 重命名并核对 APK
        run: |
          mkdir -p dist
          APK="dist/GazeReel-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          ls -l dist
          # 用 aapt2 复核包里的 versionName / versionCode，不信构建脚本自说自话。
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -1
          else
            echo "::warning::没找到 aapt2，跳过 APK 版本复核"
          fi

      - name: 生成发布说明
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            RANGE="${PREV_TAG}..HEAD"
            echo "对比范围：$RANGE"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
            echo "首个 tag，对比范围从根提交开始"
          fi
          {
            echo "## GazeReel · 凝影 \`${VERSION}\`"
            echo
            echo "> **alpha**：功能未完工，接口与交互都可能随时改。正式完工之前只出 alpha。"
            echo
            echo "### 安装"
            echo
            echo "1. 下载下面的 \`GazeReel-${VERSION}.apk\`"
            echo "2. 手机上允许「安装未知来源应用」，直接安装"
            echo "3. 装过旧 alpha 的可以直接覆盖——alpha 阶段用固定签名，不需要卸载"
            echo
            echo "### 本次变更"
            echo
            git log --pretty=format:'- %s（`%h`）' "$RANGE"
            echo
            echo
            echo "### 版本号规则"
            echo
            echo "- 格式 \`<major>.<minor>.<patch>-alpha<N>\`，当前 \`${VERSION}\`"
            echo "- \`minor\` / \`patch\` 不得超过 10（不会出现 \`1.11.11\`），越界自动进位到上一段"
            echo "- \`major\` 与 \`alpha\` 编号无上限"
            echo "- 升版本用 \`python3 tools/bump_version.py <alpha|patch|minor|major>\`"
          } > notes.md
          cat notes.md

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/GazeReel-${{ steps.version.outputs.name }}.apk" \
            --title "GazeReel ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --prerelease
