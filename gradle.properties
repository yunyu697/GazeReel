org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 注意（alpha41）：全局 ~/.gradle/gradle.properties 里残留着指向 127.0.0.1:62755
# 的 systemProp.*proxyHost/proxyPort，本地代理没启动时依赖解析会全部失败。
# 项目级写空值会被 Gradle 丢弃、nonProxyHosts=* 也不生效、--offline 不认缓存，
# 所以这里不做无效覆盖。需要联网解析依赖时改用包装脚本：
#   bash tools/gradlew-direct.sh --no-daemon :app:assembleDebug
# 它只在编译期间临时注释掉全局代理行，退出时自动还原。
